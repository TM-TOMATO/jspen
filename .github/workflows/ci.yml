name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web studio (server, studio, export, interactions)
    runs-on: ubuntu-24.04
    env:
      # Chromium needs a UTF-8 locale for non-ASCII download file names.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test

  desktop:
    name: Desktop shell (PyQt6, offscreen)
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libfontconfig1 libdbus-1-3 libasound2t64
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python tests/desktop_smoke.py
      - run: python tests/desktop_security.py

  windows:
    name: Windows desktop build (PyInstaller + self-test)
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m py_compile main.py
      - name: Desktop smoke test
        run: python tests/desktop_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Desktop security test
        run: python tests/desktop_security.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build (folder), self-test the exe and make the installer
        run: python build_exe.py --installer
      - name: Install, run and uninstall the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/JSPenStudio-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'JSPen Studio'
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", '/TASKS=associate' -Wait
          $out = & (Join-Path $dir 'JSPenStudio.exe') --selftest | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw 'installed app failed its self-test' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\JSPenStudio.Project\shell\open\command').'(default)' -notlike "*$dir*") { throw 'file association missing' }
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'JSPenStudio.exe')) { throw 'uninstall left the app behind' }
          if (Test-Path 'HKCU:\Software\Classes\JSPenStudio.Project') { throw 'uninstall left the file association behind' }
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: JSPenStudio-windows
          path: dist/JSPenStudio
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: JSPenStudio-Setup
          path: dist/installer/*.exe
          retention-days: 14
